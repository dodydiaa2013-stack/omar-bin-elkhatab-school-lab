name: Prepare LAB page text review pull request
# Apps Script writes the GitHub-only page-text JSON to the dedicated input branch.
# This workflow validates the result and opens a draft review PR only.
# It never merges or publishes automatically.
on:
  # مسار مباشر: Apps Script يرسل repository_dispatch بعد نجاح الحفظ والتحقق.
  repository_dispatch:
    types:
      - lab-page-text-saved

  # مسار احتياطي: إذا تعذر إرسال الحدث، افحص آخر نسخة محفوظة كل 5 دقائق.
  schedule:
    - cron: "*/5 * * * *"

  # احتفظ بتشغيل push وworkflow_dispatch للتوافق والتشخيص اليدوي.
  push:
    branches:
      - "automation/lab-page-text-sync-input"
    paths:
      - "page-changes-lab.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lab-page-text-sync-proposal
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the clean base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate latest saved changes
        run: |
          set -euo pipefail
          git fetch origin automation/lab-page-text-sync-input
          git show origin/automation/lab-page-text-sync-input:page-changes-lab.json > page-changes-lab.json
          node -e "const p=require('./page-changes-lab.json'); if(!p || p.success!==true || !Array.isArray(p.changes) || p.changes.some(x=>!x || typeof x.id!=='string' || typeof x.text!=='string')) process.exit(1);"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Apply and validate saved text changes
        run: |
          set -euo pipefail
          node scripts/sync-lab-page-texts.mjs
          test -s index.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if(!h.includes('data-page-edit-id=')) process.exit(1);"

      - name: Create or update the publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/lab-page-text-sync
          git add page-changes-lab.json index.html

          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          git commit -m "Prepare saved LAB school page text update"
          git push --force origin HEAD:automation/lab-page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/lab-page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create --draft \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/lab-page-text-sync \
              --title "Review saved LAB school page text" \
              --body "## LAB page-text review

          - Generated from the latest LAB GitHub-only page text payload.
          - Updates only page-changes-lab.json and matching text in index.html.
          - The workflow validates the HTML structure, all saved IDs, and duplicate IDs before creating this PR.
          - This PR is intentionally draft. No automatic merge or publication is performed.
          - Review and approve it manually only after the LAB preview has been checked."
          fi

          echo "Draft review PR is ready for human inspection. No merge was attempted."
